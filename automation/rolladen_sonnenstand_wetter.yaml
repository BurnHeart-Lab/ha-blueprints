blueprint:
  name: Rollläden – Sonne, Wetter, Tag & Nacht
  description: >
    Ein Blueprint für eine Rollladen-Gruppe einer Himmelsrichtung. Steuert den
    ganzen Tagesablauf, damit sich die Teilfunktionen nicht gegenseitig
    überfahren:


    1. GUTEN MORGEN – öffnet an Sonnenaufgang ± Offset, begrenzt auf ein Fenster
       zwischen "frühestens" (nicht um 5:00) und "spätestens" (an trüben Tagen
       trotzdem hoch). Ein Auslöser-Button startet das Öffnen sofort. Steht die
       Sonne beim Öffnen schon hoch/warm auf der Fassade, wird nur auf
       Verschattungs-Position geöffnet.

    2. TAGSÜBER VERSCHATTEN – scheint die Sonne lange genug (Verzögerung
       Schließen) auf die Fassade (Azimut ± Toleranz, hoch genug, klarer
       Himmel, warm genug), fahren die Rollläden auf die Verschattungs-Position.
       Lange genug verschattet (Verzögerung Öffnen) → wieder auf.

    3. GUTE NACHT – schließt an Sonnenuntergang ± Offset, begrenzt auf ein
       Fenster zwischen "frühestens" (Winterschutz) und "spätestens"
       (z. B. Kinder-Schlafenszeit, auch wenn die Sonne noch scheint).

    4. UNWETTERSCHUTZ – bei Hagel / Gewitter / Sturm (Wetterzustand, Dauerwind
       oder Böen – jetzt oder in der Stundenvorhersage) fahren die Rollläden zu.
       Hat immer Vorrang. Ist die Wetter-Entität unavailable/unknown, wird der
       Unwetterschutz übersprungen (statt die ganze Automation abzubrechen);
       Verschattung pausiert dann ebenfalls, Nacht/Morgen laufen normal weiter.


    Prioritätsreihenfolge: Unwetter > Nacht > Verschattung > offen.

    Es gibt KEINE Handbetrieb-Erkennung: die Automatik fährt immer auf ihre
    berechnete Soll-Position. Wer manuell steuern will, schaltet die Automation
    über den Automatik-Schalter aus.

    Pro Himmelsrichtung eine eigene Automation. Für unterschiedliche
    Schlafenszeiten (Kinderzimmer vs. Rest) zwei Instanzen mit verschiedener
    "spätester Schließzeit".

  domain: automation
  author: HA Agent
  input:
    rolllaeden:
      name: Rollläden & Positionen
      icon: mdi:window-shutter
      input:
        covers:
          name: Rollladen-Entitäten
          description: >
            Alle Cover dieser einen Himmelsrichtung. Raum-Entitäten ODER
            Gruppen, nicht beides.
          selector:
            entity:
              filter:
                domain: cover
              multiple: true
        open_position:
          name: Position "offen"
          description: "Tagsüber ohne Sonne / nach dem Öffnen. Empfehlung: 100."
          default: 100
          selector:
            number: { min: 0, max: 100, step: 5, unit_of_measurement: "%", mode: slider }
        sun_close_position:
          name: Position "Verschattung" (zu %)
          description: >
            NICHT ganz zu – sonst Wärmestau im Luftspalt vor der Scheibe und
            dunkler Raum. Empfehlung: 25–30 (Lüftungsspalt unten). 0 nur für
            Verdunkelung, 40–50 für helle Räume mit wenig Hitzeproblem.
          default: 30
          selector:
            number: { min: 0, max: 100, step: 5, unit_of_measurement: "%", mode: slider }
        night_close_position:
          name: Position "Nacht"
          description: "Beim abendlichen Schließen. Empfehlung: 0; 10–20 für Nachtluft im Sommer."
          default: 0
          selector:
            number: { min: 0, max: 100, step: 5, unit_of_measurement: "%", mode: slider }
        weather_close_position:
          name: Position "Unwetter"
          description: "Bei Hagel/Sturm. Empfehlung: 0 (schützt die Scheibe)."
          default: 0
          selector:
            number: { min: 0, max: 100, step: 5, unit_of_measurement: "%", mode: slider }

    ausrichtung:
      name: Fassaden-Ausrichtung
      icon: mdi:compass
      input:
        facade_azimuth:
          name: Himmelsrichtung der Fassade (Azimut)
          description: "0 = Nord, 90 = Ost, 180 = Süd, 225 = Südwest, 270 = West."
          default: 180
          selector:
            number: { min: 0, max: 359, step: 1, unit_of_measurement: "°", mode: box }
        azimuth_tolerance:
          name: Azimut-Toleranz (±)
          description: >
            Wie weit die Sonne seitlich von der Fassadenrichtung stehen darf und
            noch als "scheint auf die Fassade" zählt. Empfehlung: 70. ±90
            verschattet, bis die Sonne fast hinterm Haus steht (streifender
            Einfall zählt dann noch). Nordseiten kleiner (40–55).
          default: 70
          selector:
            number: { min: 20, max: 120, step: 5, unit_of_measurement: "°", mode: slider }
        sun_elevation_min:
          name: Minimale Sonnenhöhe
          description: >
            Erst ab dieser Höhe verschatten. Empfehlung: 15. Tiefer (5–10) nur,
            wenn tief stehende Ost-/Westsonne wirklich blendet/heizt. Nordseiten
            höher (20–25), sonst verschattet die schwache Morgen-/Abendsonne.
          default: 15
          selector:
            number: { min: 0, max: 40, step: 1, unit_of_measurement: "°", mode: slider }
        sun_elevation_max:
          name: Maximale Sonnenhöhe (0 = aus)
          description: "Oberhalb nicht mehr verschatten (z. B. bei Dachüberstand über Mittag)."
          default: 0
          selector:
            number: { min: 0, max: 90, step: 1, unit_of_measurement: "°", mode: slider }

    verschattung:
      name: Verschattung – Auslösung & Verzögerungen
      icon: mdi:weather-sunny
      input:
        weather_entity:
          name: Wetter-Entität
          description: "Bewölkung, Temperatur, Zustand und Vorhersage (z. B. met.no)."
          selector:
            entity:
              filter:
                domain: weather
        cloud_coverage_max:
          name: Maximale Bewölkung zum Verschatten
          description: >
            Nur genutzt, wenn die Wetter-Entität das Attribut cloud_coverage hat
            (met.no ja, WetterOnline nein). Über diesem Wolkenanteil kein starker
            Sonnenschein → nicht verschatten. Empfehlung: 40 (Bereich 30–50).
          default: 40
          selector:
            number: { min: 0, max: 100, step: 5, unit_of_measurement: "%", mode: slider }
        bright_weather_states:
          name: "Zustände, die als \"sonnig genug\" gelten"
          description: >
            Ersatz-Prüfung, wenn cloud_coverage fehlt (z. B. WetterOnline). Nur
            bei einem dieser Wetter-Zustände wird verschattet. Empfehlung: nur
            sunny – so wird an bewölkten Tagen nicht verschattet. partlycloudy
            ergänzen, wenn auch bei Wolkenlücken verschattet werden soll.
          default: [sunny]
          selector:
            select:
              multiple: true
              options: [sunny, partlycloudy, windy, windy-variant, exceptional, clear-night]
        shade_min_temperature:
          name: Verschatten erst ab (°C, 0 = aus)
          description: >
            Nur verschatten, wenn die Außentemperatur mindestens so hoch ist.
            Empfehlung: 20 (nur bei echter Hitze). 0 = Temperatur ignorieren.
          default: 20
          selector:
            number: { min: 0, max: 35, step: 1, unit_of_measurement: "°C", mode: slider }
        sun_close_delay:
          name: Verzögerung Schließen
          description: "So lange muss Sonne ununterbrochen auf die Fassade scheinen. Empfehlung: 15 Min."
          default: { hours: 0, minutes: 15, seconds: 0 }
          selector:
            duration: {}
        sun_open_delay:
          name: Verzögerung Öffnen
          description: "So lange muss es ununterbrochen verschattet sein. Empfehlung: 30 Min (länger → kein Jo-Jo)."
          default: { hours: 0, minutes: 30, seconds: 0 }
          selector:
            duration: {}

    tagesgrenzen:
      name: Guten Morgen & Gute Nacht
      icon: mdi:weather-sunset
      input:
        sunrise_offset_minutes:
          name: Offset zum Sonnenaufgang
          description: "Minuten vor (−) / nach (+) Sonnenaufgang. Empfehlung: 0 bis +15."
          default: 0
          selector:
            number: { min: -90, max: 90, step: 5, unit_of_measurement: min, mode: slider }
        earliest_open_time:
          name: Frühestens öffnen um
          description: "Verhindert Hochfahren im Hochsommer um 5:00. Empfehlung: 06:30."
          default: "06:30:00"
          selector:
            time: {}
        latest_open_time:
          name: Spätestens öffnen um
          description: "Auch an trüben Wintertagen spätestens hoch. Empfehlung: 09:00."
          default: "09:00:00"
          selector:
            time: {}
        wake_button:
          name: Auslöser-Button "Aufstehen"
          description: >
            input_button-Helfer. Drücken setzt sofort den Tag-Soll-Zustand
            (offen, oder Verschattung falls schon nötig) – unabhängig von der
            Uhrzeit. Vorher unter Einstellungen → Geräte & Dienste → Helfer
            einen "Taste"-Helfer anlegen. Abends gedrückt fahren die Rollläden
            kurz hoch und die Nacht-Logik schließt wieder.
          selector:
            entity:
              filter:
                domain: input_button
        sunset_offset_minutes:
          name: Offset zum Sonnenuntergang
          description: "Minuten vor (−) / nach (+) Sonnenuntergang. Empfehlung: −15 bis 0."
          default: -15
          selector:
            number: { min: -90, max: 90, step: 5, unit_of_measurement: min, mode: slider }
        earliest_close_time:
          name: Frühestens schließen um
          description: "Winterschutz gegen '16:30 schon dunkel'. Empfehlung: 17:00."
          default: "17:00:00"
          selector:
            time: {}
        latest_close_time:
          name: Spätestens schließen um
          description: >
            Auf jeden Fall schließen, auch wenn die Sonne noch scheint – z. B.
            Kinder-Schlafenszeit. Empfehlung: 21:30, Kinderzimmer 19:30.
            23:59 = keine Obergrenze.
          default: "21:30:00"
          selector:
            time: {}

    unwetterschutz:
      name: Unwetterschutz
      icon: mdi:weather-hail
      input:
        protective_conditions:
          name: Schutz-auslösende Wetterzustände
          description: "Jetzt oder in der Vorhersage. Empfehlung: hail, lightning-rainy, snowy-rainy."
          default: [hail, lightning-rainy, snowy-rainy]
          selector:
            select:
              multiple: true
              options: [hail, lightning, lightning-rainy, pouring, snowy, snowy-rainy, exceptional]
        wind_speed_threshold_kmh:
          name: Windgeschwindigkeit-Schwelle (km/h)
          description: >
            Dauerwind (`wind_speed`). Eingabe in km/h, Umrechnung aus der Einheit
            der Wetter-Entität automatisch. Empfehlung für Rollläden: 55 (Bft 8),
            Bereich 45–70. Markisen deutlich niedriger.
          default: 55
          selector:
            number: { min: 20, max: 120, step: 5, unit_of_measurement: "km/h", mode: slider }
        wind_gust_threshold_kmh:
          name: Böen-Schwelle (km/h, 0 = aus)
          description: >
            Zusätzliche Schwelle auf die Böen (`wind_gust_speed`), falls die
            Wetter-Entität das liefert (WetterOnline ja, met.no nein – dann
            wirkungslos). Empfehlung: 70 (Bft 8-Böe). 0 = Böen ignorieren.
          default: 70
          selector:
            number: { min: 0, max: 150, step: 5, unit_of_measurement: "km/h", mode: slider }
        severe_forecast_hours:
          name: Vorhersage-Vorlauf
          description: "Stunden voraus auf Hagel/Gewitter/Sturm prüfen. Empfehlung: 2. 0 = nur aktuelle Lage."
          default: 2
          selector:
            number: { min: 0, max: 6, step: 1, unit_of_measurement: "h", mode: slider }

    optionen:
      name: Optionen
      icon: mdi:tune
      input:
        enable_entity:
          name: Automatik-Schalter (optional)
          description: >
            input_boolean-Helfer. AN = Automatik aktiv. AUS = Automatik macht
            gar nichts, du hast volle Handkontrolle über die Rollläden. Das ist
            der Ersatz für eine Handbetrieb-Erkennung: zum manuellen Fahren erst
            hier ausschalten. Leer lassen, wenn die Automatik immer laufen soll.
          default:
          selector:
            entity:
              filter:
                domain: input_boolean

mode: queued
max: 3
max_exceeded: silent

trigger_variables:
  tv_facade_azimuth: !input facade_azimuth
  tv_azimuth_tolerance: !input azimuth_tolerance
  tv_elev_min: !input sun_elevation_min
  tv_elev_max: !input sun_elevation_max
  tv_weather: !input weather_entity
  tv_cloud_max: !input cloud_coverage_max
  tv_bright_states: !input bright_weather_states
  tv_shade_min_temp: !input shade_min_temperature

trigger:
  - platform: template
    id: sun_shade
    value_template: >
      {% set az = state_attr('sun.sun', 'azimuth') | float(999) %}
      {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
      {% set d = (az - (tv_facade_azimuth | float(180))) | abs %}
      {% set d = [d, 360 - d] | min %}
      {% set on_facade = d <= (tv_azimuth_tolerance | float(70)) %}
      {% set cc = state_attr(tv_weather, 'cloud_coverage') %}
      {% set bright = (cc | float(100) <= (tv_cloud_max | float(40))) if cc is not none
                      else (states(tv_weather) in tv_bright_states) %}
      {% set elev_ok = el >= (tv_elev_min | float(15))
                       and ((tv_elev_max | float(0)) <= 0 or el <= (tv_elev_max | float(0))) %}
      {% set warm_ok = (tv_shade_min_temp | float(0)) <= 0
                       or (state_attr(tv_weather, 'temperature') | float(-99)) >= (tv_shade_min_temp | float(0)) %}
      {{ on_facade and bright and elev_ok and warm_ok }}
    for: !input sun_close_delay
  - platform: template
    id: sun_unshade
    value_template: >
      {% set az = state_attr('sun.sun', 'azimuth') | float(999) %}
      {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
      {% set d = (az - (tv_facade_azimuth | float(180))) | abs %}
      {% set d = [d, 360 - d] | min %}
      {% set on_facade = d <= (tv_azimuth_tolerance | float(70)) %}
      {% set cc = state_attr(tv_weather, 'cloud_coverage') %}
      {% set bright = (cc | float(100) <= (tv_cloud_max | float(40))) if cc is not none
                      else (states(tv_weather) in tv_bright_states) %}
      {% set elev_ok = el >= (tv_elev_min | float(15))
                       and ((tv_elev_max | float(0)) <= 0 or el <= (tv_elev_max | float(0))) %}
      {% set warm_ok = (tv_shade_min_temp | float(0)) <= 0
                       or (state_attr(tv_weather, 'temperature') | float(-99)) >= (tv_shade_min_temp | float(0)) %}
      {{ not (on_facade and bright and elev_ok and warm_ok) }}
    for: !input sun_open_delay
  - platform: time_pattern
    id: tick
    minutes: "/1"
  - platform: state
    id: wake_button
    entity_id: !input wake_button
  - platform: state
    id: weather_change
    entity_id: !input weather_entity
  - platform: homeassistant
    id: ha_start
    event: start

variables:
  covers: !input covers
  open_position: !input open_position
  sun_close_position: !input sun_close_position
  night_close_position: !input night_close_position
  weather_close_position: !input weather_close_position
  facade_azimuth: !input facade_azimuth
  azimuth_tolerance: !input azimuth_tolerance
  elev_min: !input sun_elevation_min
  elev_max: !input sun_elevation_max
  weather_entity: !input weather_entity
  cloud_max: !input cloud_coverage_max
  bright_states: !input bright_weather_states
  shade_min_temp: !input shade_min_temperature
  sunrise_offset_min: !input sunrise_offset_minutes
  earliest_open: !input earliest_open_time
  latest_open: !input latest_open_time
  sunset_offset_min: !input sunset_offset_minutes
  earliest_close: !input earliest_close_time
  latest_close: !input latest_close_time
  protective_conditions: !input protective_conditions
  wind_threshold_kmh: !input wind_speed_threshold_kmh
  gust_threshold_kmh: !input wind_gust_threshold_kmh
  forecast_hours: !input severe_forecast_hours
  enable_entity: !input enable_entity

  enable_ok: >
    {{ enable_entity is none or enable_entity == '' or is_state(enable_entity, 'on') }}
  wind_unit_factor: >
    {% set u = state_attr(weather_entity, 'wind_speed_unit') or 'km/h' %}
    {{ {'km/h': 1.0, 'm/s': 3.6, 'mph': 1.609344, 'kn': 1.852, 'ft/s': 1.09728}.get(u, 1.0) }}

  target_open: >
    {% set nr = as_datetime(state_attr('sun.sun', 'next_rising')) %}
    {% set nr = (nr | as_local) if nr is not none else today_at(earliest_open) %}
    {% set sr = nr if nr.date() == now().date() else nr - timedelta(days=1) %}
    {% set raw = sr + timedelta(minutes=sunrise_offset_min | int(0)) %}
    {{ ([[raw, today_at(earliest_open)] | max, today_at(latest_open)] | min).isoformat() }}
  target_close: >
    {% set ns = as_datetime(state_attr('sun.sun', 'next_setting')) %}
    {% set ns = (ns | as_local) if ns is not none else today_at(latest_close) %}
    {% set ss = ns if ns.date() == now().date() else ns - timedelta(days=1) %}
    {% set raw = ss + timedelta(minutes=sunset_offset_min | int(0)) %}
    {{ ([[raw, today_at(earliest_close)] | max, today_at(latest_close)] | min).isoformat() }}

  is_night: >
    {{ now() < as_datetime(target_open) or now() >= as_datetime(target_close) }}
  morning_crossing: >
    {% set t = as_datetime(target_open) %}
    {{ now() >= t and now() < t + timedelta(minutes=2) }}

  sun_on_facade: >
    {% set az = state_attr('sun.sun', 'azimuth') | float(999) %}
    {% set d = (az - (facade_azimuth | float(180))) | abs %}
    {% set d = [d, 360 - d] | min %}
    {{ d <= (azimuth_tolerance | float(70)) }}
  shade_now: >
    {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
    {% set cc = state_attr(weather_entity, 'cloud_coverage') %}
    {% set bright = (cc | float(100) <= (cloud_max | float(40))) if cc is not none
                    else (states(weather_entity) in bright_states) %}
    {% set elev_ok = el >= (elev_min | float(15))
                     and ((elev_max | float(0)) <= 0 or el <= (elev_max | float(0))) %}
    {% set warm_ok = (shade_min_temp | float(0)) <= 0
                     or (state_attr(weather_entity, 'temperature') | float(-99)) >= (shade_min_temp | float(0)) %}
    {{ sun_on_facade and bright and elev_ok and warm_ok }}

  weather_ok: >
    {{ states(weather_entity) not in ['unavailable', 'unknown', 'none', ''] }}
  now_threat: >
    {% set c = states(weather_entity) %}
    {% set kmh  = (state_attr(weather_entity, 'wind_speed') | float(0)) * (wind_unit_factor | float(1)) %}
    {% set gust = (state_attr(weather_entity, 'wind_gust_speed') | float(0)) * (wind_unit_factor | float(1)) %}
    {{ weather_ok and (
         c in protective_conditions
         or kmh >= (wind_threshold_kmh | float(55))
         or ((gust_threshold_kmh | float(0)) > 0 and gust >= (gust_threshold_kmh | float(0)))
       ) }}

action:
  # ---------------------------------------------------------------
  # 0. Unwetter-Vorhersage (nur periodisch / bei Wetterwechsel laden)
  # ---------------------------------------------------------------
  - variables:
      fc_threat: false
  - if:
      - "{{ enable_ok }}"
      - "{{ weather_ok }}"
      - "{{ not now_threat }}"
      - "{{ (forecast_hours | int(0)) > 0 }}"
      - >
        {{ trigger.id in ['weather_change', 'ha_start', 'wake_button']
           or (trigger.id == 'tick' and now().minute % 15 == 0) }}
    then:
      # continue_on_error: eine kaputte/unavailable Wetter-Entität darf die
      # Automation (Nacht/Morgen/Verschattung) NICHT abbrechen.
      - service: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: !input weather_entity
        data:
          type: hourly
        response_variable: fc
      - variables:
          fc_threat: >
            {% set items = (fc.get(weather_entity, {}).get('forecast', []) if fc is defined else []) %}
            {% set horizon = now() + timedelta(hours=forecast_hours | int(2)) %}
            {% set ns = namespace(hit=false) %}
            {% for f in items %}
              {% set dt = as_datetime(f.datetime) %}
              {% if dt is not none and dt <= horizon %}
                {% set fkmh  = (f.get('wind_speed', 0) | float(0)) * (wind_unit_factor | float(1)) %}
                {% set fgust = (f.get('wind_gust_speed', 0) | float(0)) * (wind_unit_factor | float(1)) %}
                {% if f.get('condition') in protective_conditions
                      or fkmh >= (wind_threshold_kmh | float(55))
                      or ((gust_threshold_kmh | float(0)) > 0 and fgust >= (gust_threshold_kmh | float(0))) %}
                  {% set ns.hit = true %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.hit }}
  - variables:
      severe_weather: "{{ now_threat or fc_threat }}"

  # Prioritätsreihenfolge über 4 Zweige. Entprellung: in die Verschattung nur
  # über den sun_shade-Trigger (for: Verzögerung Schließen), aus der
  # Verschattung nur über sun_unshade (for: Verzögerung Öffnen). tick/ha_start
  # fahren nur die "harten" Stufen (Unwetter/Nacht) und das Morgen-Fenster.
  - choose:
      # ---- A. Unwetter ----------------------------------------------
      - conditions:
          - "{{ enable_ok }}"
          - "{{ severe_weather }}"
        sequence:
          - variables:
              target: !input weather_close_position
          - repeat:
              for_each: "{{ covers }}"
              sequence:
                - variables:
                    cur: "{{ state_attr(repeat.item, 'current_position') }}"
                - choose:
                    - conditions:
                        - "{{ cur is not none }}"
                        - "{{ ((cur | int(0)) - (target | int(0))) | abs > 2 }}"
                      sequence:
                        - service: cover.set_cover_position
                          target: { entity_id: "{{ repeat.item }}" }
                          data: { position: "{{ target | int(0) }}" }
                    - conditions:
                        - "{{ cur is none }}"
                        - "{{ (target | int(0)) <= 0 }}"
                        - "{{ is_state(repeat.item, 'open') }}"
                      sequence:
                        - service: cover.close_cover
                          target: { entity_id: "{{ repeat.item }}" }
                    - conditions:
                        - "{{ cur is none }}"
                        - "{{ (target | int(0)) >= 100 }}"
                        - "{{ is_state(repeat.item, 'closed') }}"
                      sequence:
                        - service: cover.open_cover
                          target: { entity_id: "{{ repeat.item }}" }

      # ---- B. Nacht -----------------------------------------------
      - conditions:
          - "{{ enable_ok }}"
          - "{{ not severe_weather }}"
          - "{{ is_night }}"
          - "{{ trigger.id in ['tick', 'ha_start', 'weather_change', 'wake_button'] }}"
        sequence:
          - variables:
              target: !input night_close_position
          - repeat:
              for_each: "{{ covers }}"
              sequence:
                - variables:
                    cur: "{{ state_attr(repeat.item, 'current_position') }}"
                - choose:
                    - conditions:
                        - "{{ cur is not none }}"
                        - "{{ ((cur | int(0)) - (target | int(0))) | abs > 2 }}"
                      sequence:
                        - service: cover.set_cover_position
                          target: { entity_id: "{{ repeat.item }}" }
                          data: { position: "{{ target | int(0) }}" }
                    - conditions:
                        - "{{ cur is none }}"
                        - "{{ (target | int(0)) <= 0 }}"
                        - "{{ is_state(repeat.item, 'open') }}"
                      sequence:
                        - service: cover.close_cover
                          target: { entity_id: "{{ repeat.item }}" }
                    - conditions:
                        - "{{ cur is none }}"
                        - "{{ (target | int(0)) >= 100 }}"
                        - "{{ is_state(repeat.item, 'closed') }}"
                      sequence:
                        - service: cover.open_cover
                          target: { entity_id: "{{ repeat.item }}" }

      # ---- C. Verschatten (entprellt) --------------------------
      - conditions:
          - "{{ enable_ok }}"
          - "{{ not severe_weather }}"
          - "{{ not is_night }}"
          - "{{ shade_now }}"
          - "{{ trigger.id in ['sun_shade', 'ha_start', 'wake_button'] }}"
        sequence:
          - variables:
              target: !input sun_close_position
          - repeat:
              for_each: "{{ covers }}"
              sequence:
                - variables:
                    cur: "{{ state_attr(repeat.item, 'current_position') }}"
                - choose:
                    - conditions:
                        - "{{ cur is not none }}"
                        - "{{ ((cur | int(0)) - (target | int(0))) | abs > 2 }}"
                      sequence:
                        - service: cover.set_cover_position
                          target: { entity_id: "{{ repeat.item }}" }
                          data: { position: "{{ target | int(0) }}" }
                    - conditions:
                        - "{{ cur is none }}"
                        - "{{ (target | int(0)) <= 0 }}"
                        - "{{ is_state(repeat.item, 'open') }}"
                      sequence:
                        - service: cover.close_cover
                          target: { entity_id: "{{ repeat.item }}" }
                    - conditions:
                        - "{{ cur is none }}"
                        - "{{ (target | int(0)) >= 100 }}"
                        - "{{ is_state(repeat.item, 'closed') }}"
                      sequence:
                        - service: cover.open_cover
                          target: { entity_id: "{{ repeat.item }}" }

      # ---- D. Offen (entprellt) / Morgen-Fenster --------------
      - conditions:
          - "{{ enable_ok }}"
          - "{{ not severe_weather }}"
          - "{{ not is_night }}"
          - "{{ not shade_now }}"
          - >
            {{ trigger.id in ['sun_unshade', 'ha_start', 'wake_button']
               or (trigger.id == 'tick' and morning_crossing) }}
        sequence:
          - variables:
              target: !input open_position
          - repeat:
              for_each: "{{ covers }}"
              sequence:
                - variables:
                    cur: "{{ state_attr(repeat.item, 'current_position') }}"
                - choose:
                    - conditions:
                        - "{{ cur is not none }}"
                        - "{{ ((cur | int(0)) - (target | int(0))) | abs > 2 }}"
                      sequence:
                        - service: cover.set_cover_position
                          target: { entity_id: "{{ repeat.item }}" }
                          data: { position: "{{ target | int(0) }}" }
                    - conditions:
                        - "{{ cur is none }}"
                        - "{{ (target | int(0)) <= 0 }}"
                        - "{{ is_state(repeat.item, 'open') }}"
                      sequence:
                        - service: cover.close_cover
                          target: { entity_id: "{{ repeat.item }}" }
                    - conditions:
                        - "{{ cur is none }}"
                        - "{{ (target | int(0)) >= 100 }}"
                        - "{{ is_state(repeat.item, 'closed') }}"
                      sequence:
                        - service: cover.open_cover
                          target: { entity_id: "{{ repeat.item }}" }
